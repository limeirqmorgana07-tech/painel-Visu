{% extends "base.html" %}
{% block titulo %}Caixinha · categorias de gasto{% endblock %}
{% block ctx %}As opções que o encarregado escolhe ao lançar o gasto{% endblock %}
{% block acoes_topo %}<a class="btn ghost" href="{{ url_for('caixinha.inicio') }}">← Cartões</a>{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:640px;"><div class="table-wrap"><table>
  {% for k in cats %}<tr><td><form method="post" class="inline-form"><input type="hidden" name="id" value="{{ k.id }}"><input name="nome" value="{{ k.nome }}" style="min-width:280px;">
    <select name="ativo"><option value="1">Ativa</option><option value="0" {{ 'selected' if not k.ativo }}>Inativa</option></select><button class="btn sm">Salvar</button></form></td></tr>{% endfor %}
  <tr><td><form method="post" class="inline-form"><input name="nome" placeholder="Nova categoria…" required style="min-width:280px;"><button class="btn sm primary">+ Incluir</button></form></td></tr>
</table></div></div>
{% endblock %}
